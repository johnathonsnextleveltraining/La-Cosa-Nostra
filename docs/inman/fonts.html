<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Me vs Me — font pick</title>
<style>body{margin:0;background:#151718;color:#EEF6FA;font-family:system-ui,sans-serif}h1{font-size:18px;text-align:center;margin:16px 8px 4px}p{text-align:center;margin:0 8px 14px;color:#A9C3CF;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;padding:0 8px 30px}.col{text-align:center}.col b{display:block;font-size:22px;margin:6px 0;color:#87CEEB}
iframe{width:390px;height:760px;border:2px solid #333;border-radius:14px;background:#000}</style></head><body>
<h1>Pick your font: 1, 2 or 3</h1><p>Only the big stuff changes (title, WEEK, THE WORK, day chips). Exercise names &amp; numbers stay clean.</p>
<div class="row">
<div class="col"><b>1 · CLEAN (live now)</b><iframe data-f="" src="mix.html?v=40"></iframe></div>
<div class="col"><b>2 · RUBIK DIRT</b><iframe data-f="Rubik Dirt" src="mix.html?v=41"></iframe></div>
<div class="col"><b>3 · RUBIK DISTRESSED</b><iframe data-f="Rubik Distressed" src="mix.html?v=42"></iframe></div>
</div>
<script>
document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',()=>{const d=f.contentDocument,ff=f.dataset.f;
const st=d.createElement('style');let css='.brand img{display:none!important}';
if(ff){const l=d.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Rubik+Distressed&display=swap';d.head.appendChild(l);
css+=`.ttl,.wk .n,.work,.days .day{font-family:"${ff}",sans-serif!important;font-style:normal!important;font-weight:400!important}.wk .n{font-size:34px!important}.work{font-size:20px!important}.ttl{font-size:30px!important}.ttl .tag{font-family:"Barlow Condensed"!important;font-weight:700!important}`;}
st.textContent=css;d.head.appendChild(st);}));
</script></body></html>
